name: Build & Release Android APK (LiveNova AI)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Production Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🚀 Build Web Production Assets (dist)
        run: |
          npm run build
        env:
          NODE_ENV: production
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"

      - name: 🔌 Install Capacitor CLI & Core
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save --legacy-peer-deps

      - name: 🛠️ Initialize Capacitor & Create Android Project
        run: |
          npx cap init "LiveNova AI" "com.livenova.ai" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: 🔑 Configure Release Keystore
        working-directory: android
        run: |
          echo "Generating production release signing keystore..."
          keytool -genkeypair -v -keystore release.keystore -alias livenova -keyalg RSA -keysize 2048 -validity 10000 -storepass "LiveNovaReleasePass123" -keypass "LiveNovaReleasePass123" -dname "CN=LiveNova, OU=Mobile, O=LiveNova AI, L=City, S=State, C=IN"

      - name: 🏗️ Build Signed Release APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=LiveNovaReleasePass123 \
            -Pandroid.injected.signing.key.alias=livenova \
            -Pandroid.injected.signing.key.password=LiveNovaReleasePass123

      - name: 📋 Locate and Rename Release APK
        run: |
          mkdir -p output-apk
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "Searching alternative APK location..."
            RELEASE_APK=$(find android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          fi
          echo "Found Release APK at: $RELEASE_APK"
          cp "$RELEASE_APK" output-apk/LiveNova-AI-Release.apk
          ls -lh output-apk/

      - name: 📤 Upload Production Release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LiveNova-AI-Release-APK
          path: output-apk/LiveNova-AI-Release.apk
          retention-days: 30

      - name: 🏷️ Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "LiveNova AI Production Release v1.0.${{ github.run_number }}"
          body: |
            ## 🚀 LiveNova AI - Production Release APK
            - **Build**: Release Mode (Signed production APK, Not Debug)
            - **App Name**: LiveNova AI
            - **Package**: `com.livenova.ai`
            - **Commit**: ${{ github.sha }}
            
            Downlaod and install `LiveNova-AI-Release.apk` directly on Android devices!
          files: output-apk/LiveNova-AI-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏁 Summary
        run: |
          echo "### 🎉 Android Production Release APK Successfully Built!" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: \`LiveNova-AI-Release.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing**: Release Signed (Keystore RSA 2048)" >> $GITHUB_STEP_SUMMARY
          echo "- **Download**: Check the GitHub Artifacts tab or GitHub Releases" >> $GITHUB_STEP_SUMMARY
